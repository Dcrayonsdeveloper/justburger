<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="osbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1810"/>
      <stop offset="60%" stop-color="#3d2b1f"/>
      <stop offset="100%" stop-color="#4a3020"/>
    </linearGradient>
    <linearGradient id="osbrick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b3a1f"/>
      <stop offset="100%" stop-color="#5a2d16"/>
    </linearGradient>
    <linearGradient id="oslight" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FF8F00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="oslamp1" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#FF8F00" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#FF6F00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oslamp2" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#FF8F00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="osbulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="60%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </radialGradient>
    <filter id="osshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="osglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="osblur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#osbg)"/>

  <!-- ===== BRICK WALL TEXTURE ===== -->
  <g opacity="0.4">
    <!-- Row 1 -->
    <rect x="0" y="0" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="66" y="0" width="62" height="24" rx="2" fill="#6b3a1f"/>
    <rect x="132" y="0" width="62" height="24" rx="2" fill="#5a2d16"/>
    <rect x="198" y="0" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="264" y="0" width="62" height="24" rx="2" fill="#6b3a1f"/>
    <rect x="330" y="0" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="396" y="0" width="62" height="24" rx="2" fill="#5a2d16"/>
    <rect x="462" y="0" width="38" height="24" rx="2" fill="url(#osbrick)"/>
    <!-- Row 2 (offset) -->
    <rect x="-20" y="28" width="62" height="24" rx="2" fill="#5a2d16"/>
    <rect x="46" y="28" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="112" y="28" width="62" height="24" rx="2" fill="#6b3a1f"/>
    <rect x="178" y="28" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="244" y="28" width="62" height="24" rx="2" fill="#5a2d16"/>
    <rect x="310" y="28" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="376" y="28" width="62" height="24" rx="2" fill="#6b3a1f"/>
    <rect x="442" y="28" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <!-- Row 3 -->
    <rect x="0" y="56" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="66" y="56" width="62" height="24" rx="2" fill="#5a2d16"/>
    <rect x="132" y="56" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="198" y="56" width="62" height="24" rx="2" fill="#6b3a1f"/>
    <rect x="264" y="56" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="330" y="56" width="62" height="24" rx="2" fill="#5a2d16"/>
    <rect x="396" y="56" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="462" y="56" width="38" height="24" rx="2" fill="#6b3a1f"/>
    <!-- Row 4 (offset) -->
    <rect x="-20" y="84" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="46" y="84" width="62" height="24" rx="2" fill="#5a2d16"/>
    <rect x="112" y="84" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="178" y="84" width="62" height="24" rx="2" fill="#6b3a1f"/>
    <rect x="244" y="84" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="310" y="84" width="62" height="24" rx="2" fill="#5a2d16"/>
    <rect x="376" y="84" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="442" y="84" width="62" height="24" rx="2" fill="#5a2d16"/>
    <!-- Row 5 -->
    <rect x="0" y="112" width="62" height="24" rx="2" fill="#5a2d16"/>
    <rect x="66" y="112" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="132" y="112" width="62" height="24" rx="2" fill="#6b3a1f"/>
    <rect x="198" y="112" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="264" y="112" width="62" height="24" rx="2" fill="#5a2d16"/>
    <rect x="330" y="112" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="396" y="112" width="62" height="24" rx="2" fill="#6b3a1f"/>
    <rect x="462" y="112" width="38" height="24" rx="2" fill="url(#osbrick)"/>
    <!-- Row 6 (offset) -->
    <rect x="-20" y="140" width="62" height="24" rx="2" fill="#6b3a1f"/>
    <rect x="46" y="140" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="112" y="140" width="62" height="24" rx="2" fill="#5a2d16"/>
    <rect x="178" y="140" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="244" y="140" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="310" y="140" width="62" height="24" rx="2" fill="#6b3a1f"/>
    <rect x="376" y="140" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="442" y="140" width="62" height="24" rx="2" fill="#5a2d16"/>
    <!-- Row 7 -->
    <rect x="0" y="168" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="66" y="168" width="62" height="24" rx="2" fill="#6b3a1f"/>
    <rect x="132" y="168" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="198" y="168" width="62" height="24" rx="2" fill="#5a2d16"/>
    <rect x="264" y="168" width="62" height="24" rx="2" fill="#6b3a1f"/>
    <rect x="330" y="168" width="62" height="24" rx="2" fill="url(#osbrick)"/>
    <rect x="396" y="168" width="62" height="24" rx="2" fill="#5a2d16"/>
    <rect x="462" y="168" width="38" height="24" rx="2" fill="#6b3a1f"/>
  </g>

  <!-- Mortar lines (subtle) -->
  <g opacity="0.15">
    <line x1="0" y1="27" x2="500" y2="27" stroke="#2d1810" stroke-width="3"/>
    <line x1="0" y1="55" x2="500" y2="55" stroke="#2d1810" stroke-width="3"/>
    <line x1="0" y1="83" x2="500" y2="83" stroke="#2d1810" stroke-width="3"/>
    <line x1="0" y1="111" x2="500" y2="111" stroke="#2d1810" stroke-width="3"/>
    <line x1="0" y1="139" x2="500" y2="139" stroke="#2d1810" stroke-width="3"/>
    <line x1="0" y1="167" x2="500" y2="167" stroke="#2d1810" stroke-width="3"/>
    <line x1="0" y1="195" x2="500" y2="195" stroke="#2d1810" stroke-width="3"/>
  </g>

  <!-- Dark gradient overlay from bottom (floor transition) -->
  <rect x="0" y="160" width="500" height="240" fill="#2d1810" opacity="0.6"/>
  <rect x="0" y="180" width="500" height="220" fill="#3d2b1f" opacity="0.4"/>

  <!-- ===== PENDANT LIGHTS ===== -->

  <!-- Left pendant light -->
  <g transform="translate(130, 0)">
    <!-- Wire -->
    <line x1="0" y1="0" x2="0" y2="70" stroke="#666" stroke-width="1.5"/>
    <!-- Fixture -->
    <path d="M-18,70 L-12,55 L12,55 L18,70 Z" fill="#444"/>
    <rect x="-14" y="54" width="28" height="4" rx="2" fill="#555"/>
    <!-- Bulb glow -->
    <circle cx="0" cy="78" r="18" fill="#FF8F00" opacity="0.3" filter="url(#osglow)"/>
    <circle cx="0" cy="78" r="10" fill="url(#osbulb)"/>
    <!-- Light cone -->
    <ellipse cx="0" cy="220" rx="120" ry="130" fill="url(#oslamp1)"/>
  </g>

  <!-- Right pendant light -->
  <g transform="translate(370, 0)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#666" stroke-width="1.5"/>
    <path d="M-16,60 L-10,47 L10,47 L16,60 Z" fill="#444"/>
    <rect x="-12" y="46" width="24" height="3.5" rx="1.5" fill="#555"/>
    <circle cx="0" cy="67" r="15" fill="#FFC107" opacity="0.25" filter="url(#osglow)"/>
    <circle cx="0" cy="67" r="8" fill="url(#osbulb)"/>
    <ellipse cx="0" cy="200" rx="110" ry="120" fill="url(#oslamp2)"/>
  </g>

  <!-- ===== FLOOR / SURFACE ===== -->
  <rect x="0" y="300" width="500" height="100" fill="#2d1810"/>
  <!-- Wood floor planks -->
  <g opacity="0.3">
    <rect x="0" y="300" width="500" height="16" fill="#3d2b1f"/>
    <rect x="0" y="320" width="500" height="16" fill="#4a3020"/>
    <rect x="0" y="340" width="500" height="16" fill="#3d2b1f"/>
    <rect x="0" y="360" width="500" height="16" fill="#4a3020"/>
    <rect x="0" y="380" width="500" height="20" fill="#3d2b1f"/>
    <!-- Plank gaps -->
    <line x1="0" y1="316" x2="500" y2="316" stroke="#1a1210" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="336" x2="500" y2="336" stroke="#1a1210" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="356" x2="500" y2="356" stroke="#1a1210" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="376" x2="500" y2="376" stroke="#1a1210" stroke-width="1" opacity="0.5"/>
    <!-- Vertical plank joints -->
    <line x1="100" y1="300" x2="100" y2="400" stroke="#1a1210" stroke-width="0.5" opacity="0.3"/>
    <line x1="250" y1="300" x2="250" y2="400" stroke="#1a1210" stroke-width="0.5" opacity="0.3"/>
    <line x1="380" y1="300" x2="380" y2="400" stroke="#1a1210" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- ===== TABLE SETTING (center) ===== -->
  <g filter="url(#osshadow)">
    <!-- Table surface (top-down view, partial) -->
    <ellipse cx="250" cy="320" rx="160" ry="55" fill="#5a3a28"/>
    <ellipse cx="250" cy="316" rx="155" ry="50" fill="#6b4a35"/>
    <ellipse cx="250" cy="314" rx="148" ry="44" fill="#7a5840" opacity="0.5"/>
  </g>

  <!-- Table items -->

  <!-- Plate (left) -->
  <g transform="translate(180, 305)">
    <ellipse cx="0" cy="0" rx="42" ry="16" fill="#ddd"/>
    <ellipse cx="0" cy="-1" rx="38" ry="13" fill="#eee"/>
    <ellipse cx="0" cy="-2" rx="30" ry="10" fill="#f5f5f5"/>
    <!-- Small burger on plate -->
    <ellipse cx="0" cy="-8" rx="18" ry="8" fill="#D4903A"/>
    <rect x="-18" y="-6" width="36" height="3" fill="#4CAF50" rx="1"/>
    <ellipse cx="0" cy="-2" rx="16" ry="6" fill="#5D2F0E"/>
    <rect x="-18" y="2" width="36" height="5" fill="#A0622A" rx="2"/>
  </g>

  <!-- Glass (right) -->
  <g transform="translate(320, 295)">
    <!-- Glass body -->
    <path d="M-10,15 L-8,-20 L8,-20 L10,15 Z" fill="#fff" opacity="0.15"/>
    <path d="M-10,15 L-8,-20 L8,-20 L10,15 Z" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <!-- Liquid inside -->
    <path d="M-9,10 L-8,-10 L8,-10 L9,10 Z" fill="#8B4513" opacity="0.4"/>
    <!-- Glass rim highlight -->
    <ellipse cx="0" cy="-20" rx="8" ry="3" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.4"/>
    <!-- Ice cubes hint -->
    <rect x="-4" y="-8" width="5" height="4" fill="#fff" opacity="0.15" rx="1" transform="rotate(10,-1.5,-6)"/>
  </g>

  <!-- Napkin/utensils (far right) -->
  <g transform="translate(350, 310)">
    <!-- Napkin -->
    <rect x="0" y="-5" width="22" height="18" fill="#E8D5C4" opacity="0.4" rx="1" transform="rotate(5,11,4)"/>
    <!-- Fork silhouette -->
    <line x1="8" y1="-18" x2="8" y2="10" stroke="#aaa" stroke-width="1.2" opacity="0.4"/>
    <line x1="5" y1="-18" x2="5" y2="-12" stroke="#aaa" stroke-width="0.8" opacity="0.3"/>
    <line x1="11" y1="-18" x2="11" y2="-12" stroke="#aaa" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Candle on table -->
  <g transform="translate(250, 285)">
    <!-- Candle holder -->
    <ellipse cx="0" cy="8" rx="10" ry="4" fill="#666"/>
    <rect x="-4" y="-12" width="8" height="20" fill="#E8D5C4" rx="2"/>
    <!-- Flame -->
    <path d="M0,-22 Q-5,-16 -3,-12 Q0,-8 3,-12 Q5,-16 0,-22 Z" fill="#FF8F00"/>
    <path d="M0,-20 Q-3,-16 -1.5,-13 Q0,-10 1.5,-13 Q3,-16 0,-20 Z" fill="#FFC107" opacity="0.7"/>
    <!-- Flame glow -->
    <circle cx="0" cy="-16" r="12" fill="#FF8F00" opacity="0.1" filter="url(#osblur)"/>
  </g>

  <!-- ===== WALL DECOR ===== -->

  <!-- Framed picture (left wall) -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="50" height="40" fill="#4a3020" rx="2"/>
    <rect x="3" y="3" width="44" height="34" fill="#3d2b1f" rx="1"/>
    <rect x="5" y="5" width="40" height="30" fill="#5a3a28" rx="1"/>
    <!-- Abstract burger art inside frame -->
    <circle cx="25" cy="18" r="10" fill="#D4903A" opacity="0.5"/>
    <rect x="15" y="16" width="20" height="3" fill="#4CAF50" opacity="0.4" rx="1"/>
  </g>

  <!-- Small shelf with items (right wall) -->
  <g transform="translate(400, 150)">
    <rect x="0" y="0" width="60" height="4" fill="#5a3a28"/>
    <!-- Bottle -->
    <rect x="10" y="-22" width="8" height="22" fill="#4a3020" rx="2"/>
    <rect x="12" y="-28" width="4" height="8" fill="#3d2b1f" rx="1"/>
    <!-- Small pot -->
    <rect x="35" y="-14" width="14" height="14" fill="#666" rx="2"/>
    <rect x="33" y="-16" width="18" height="4" fill="#555" rx="1"/>
  </g>

  <!-- ===== OVERALL WARM OVERLAY ===== -->
  <rect width="500" height="400" fill="#FF8F00" opacity="0.03"/>

  <!-- Vignette edges -->
  <rect width="500" height="400" fill="none" stroke="#1a1210" stroke-width="30" opacity="0.3" rx="0"/>

  <!-- Warm vignette corners -->
  <radialGradient id="osvignette" cx="0.5" cy="0.5" r="0.7">
    <stop offset="0%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
  </radialGradient>
  <rect width="500" height="400" fill="url(#osvignette)"/>
</svg>
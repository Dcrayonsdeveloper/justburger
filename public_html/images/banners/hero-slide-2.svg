<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <linearGradient id="s2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="40%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#2d1810"/>
    </linearGradient>
    <linearGradient id="s2bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4903A"/>
      <stop offset="100%" stop-color="#A0622A"/>
    </linearGradient>
    <linearGradient id="s2patty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B3F14"/>
      <stop offset="100%" stop-color="#4A2508"/>
    </linearGradient>
    <radialGradient id="s2glow" cx="0.4" cy="0.5" r="0.6">

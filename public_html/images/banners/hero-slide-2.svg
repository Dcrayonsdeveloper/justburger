    <path d="M-165,8 L165,8 L165,18 Q140,18 132,32 Q128,40 125,18 L50,18 Q44,18 40,28 Q37,36 34,18 L-80,18 Q-84,18 -88,30 Q-92,40 -95,18 L-165,18 Z" fill="#FFC107"/>

      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0"/>
    </radialGradient>
    <filter id="s2sh"><feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1920" height="600" fill="url(#s2bg)"/>
  <rect width="1920" height="600" fill="url(#s2glow)"/>
  <!-- Bokeh -->
  <circle cx="200" cy="120" r="70" fill="#FF8F00" opacity="0.06"/>
  <circle cx="80" cy="450" r="90" fill="#FFC107" opacity="0.04"/>
  <circle cx="1780" cy="100" r="65" fill="#D4903A" opacity="0.05"/>

    <ellipse cx="-20" cy="-125" rx="7" ry="4" fill="#FFF5DC" opacity="0.65" transform="rotate(-3,-20,-125)"/>
    <path d="M-180,-28 Q-130,-50 -80,-24 Q-30,-48 20,-26 Q70,-48 120,-24 Q160,-44 175,-24 L178,-10 Q140,-30 95,-6 Q45,-30 -5,-8 Q-55,-30 -105,-8 Q-150,-26 -180,-10 Z" fill="#4CAF50"/>

  <line x1="870" y1="390" x2="870" y2="600" stroke="#6B4226" stroke-width="1" opacity="0.1"/>
  <line x1="970" y1="390" x2="970" y2="600" stroke="#6B4226" stroke-width="1" opacity="0.1"/>
  <line x1="1070" y1="390" x2="1070" y2="600" stroke="#6B4226" stroke-width="1" opacity="0.1"/>
  <line x1="1170" y1="390" x2="1170" y2="600" stroke="#6B4226" stroke-width="1" opacity="0.1"/>

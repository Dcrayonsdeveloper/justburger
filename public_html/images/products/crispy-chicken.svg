<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg6" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#8D5524"/>
    </radialGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bun6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4903A"/>
      <stop offset="100%" stop-color="#A0622A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg6)" rx="20"/>
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="2" rx="15"/>
  <!-- Burger -->
  <g transform="translate(400,340)" filter="url(#shadow6)">
    <!-- Top bun -->
    <ellipse cx="0" cy="-55" rx="120" ry="48" fill="url(#bun6)"/>
    <ellipse cx="0" cy="-65" rx="110" ry="28" fill="#E8A94D" opacity="0.45"/>
    <!-- Seeds -->
    <ellipse cx="-35" cy="-78" rx="6" ry="4" fill="#FFF5DC"/>
    <ellipse cx="25" cy="-82" rx="6" ry="4" fill="#FFF5DC"/>
    <ellipse cx="55" cy="-73" rx="6" ry="4" fill="#FFF5DC"/>
    <!-- Lettuce -->
    <path d="M-130,-22 Q-100,-35 -70,-18 Q-40,-35 0,-20 Q40,-35 70,-18 Q100,-35 130,-22 L130,-12 Q100,-25 70,-8 Q40,-25 0,-10 Q-40,-25 -70,-8 Q-100,-25 -130,-12 Z" fill="#66BB6A"/>
    <!-- Tomato -->
    <ellipse cx="-40" cy="-5" rx="30" ry="8" fill="#E53935"/>
    <ellipse cx="30" cy="-3" rx="28" ry="7" fill="#EF5350"/>
    <!-- Crispy chicken patty -->
    <ellipse cx="0" cy="20" rx="110" ry="28" fill="#D4903A"/>
    <ellipse cx="0" cy="15" rx="105" ry="22" fill="#E8A94D" opacity="0.5"/>
    <!-- Crispy texture -->
    <circle cx="-50" cy="15" r="5" fill="#C88030" opacity="0.5"/>
    <circle cx="-20" cy="22" r="4" fill="#C88030" opacity="0.4"/>
    <circle cx="30" cy="12" r="5" fill="#C88030" opacity="0.5"/>
    <circle cx="60" cy="20" r="4" fill="#C88030" opacity="0.45"/>
    <circle cx="-70" cy="22" r="3" fill="#C88030" opacity="0.4"/>
    <circle cx="80" cy="16" r="4" fill="#C88030" opacity="0.5"/>
    <!-- Bottom bun -->
    <rect x="-120" y="42" width="240" height="28" fill="url(#bun6)" rx="5"/>
    <ellipse cx="0" cy="70" rx="120" ry="12" fill="#A0622A"/>
  </g>
  <!-- Text -->
  <text x="400" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#fff" filter="url(#shadow6)">Crispy Chicken</text>
  <text x="400" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#FFE0B2" letter-spacing="3">JUSTBURGERS</text>
</svg>
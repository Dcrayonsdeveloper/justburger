<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </radialGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bun4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8933A"/>
      <stop offset="100%" stop-color="#8B5E22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg4)" rx="20"/>
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#D7CCC8" stroke-opacity="0.15" stroke-width="2" rx="15"/>
  <!-- Burger -->
  <g transform="translate(400,340)" filter="url(#shadow4)">
    <!-- Top bun -->
    <ellipse cx="0" cy="-60" rx="122" ry="50" fill="url(#bun4)"/>
    <ellipse cx="0" cy="-70" rx="112" ry="30" fill="#D4A04D" opacity="0.4"/>
    <!-- Seeds -->
    <ellipse cx="-38" cy="-80" rx="6" ry="4" fill="#FFF5DC"/>
    <ellipse cx="25" cy="-85" rx="6" ry="4" fill="#FFF5DC"/>
    <ellipse cx="55" cy="-75" rx="6" ry="4" fill="#FFF5DC"/>
    <!-- Mushroom slices -->
    <ellipse cx="-50" cy="-20" rx="22" ry="10" fill="#8D6E63"/>
    <rect x="-54" y="-20" width="8" height="12" fill="#A1887F" rx="2"/>
    <ellipse cx="10" cy="-18" rx="20" ry="9" fill="#795548"/>
    <rect x="6" y="-18" width="8" height="11" fill="#8D6E63" rx="2"/>
    <ellipse cx="60" cy="-22" rx="18" ry="8" fill="#8D6E63"/>
    <rect x="57" y="-22" width="7" height="10" fill="#A1887F" rx="2"/>
    <!-- Swiss cheese (with holes) -->
    <rect x="-120" y="-5" width="240" height="22" fill="#FFF9C4" rx="3"/>
    <circle cx="-60" cy="6" r="5" fill="#F0E68C"/>
    <circle cx="20" cy="3" r="4" fill="#F0E68C"/>
    <circle cx="70" cy="8" r="6" fill="#F0E68C"/>
    <circle cx="-20" cy="10" r="3" fill="#F0E68C"/>
    <!-- Patty -->
    <ellipse cx="0" cy="30" rx="115" ry="25" fill="#4A2508"/>
    <ellipse cx="0" cy="25" rx="108" ry="18" fill="#6B3A15" opacity="0.5"/>
    <!-- Bottom bun -->
    <rect x="-122" y="50" width="244" height="28" fill="url(#bun4)" rx="5"/>
    <ellipse cx="0" cy="78" rx="122" ry="12" fill="#8B5E22"/>
  </g>
  <!-- Text -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#fff" filter="url(#shadow4)">Mushroom Swiss</text>
  <text x="400" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#D7CCC8" letter-spacing="3">JUSTBURGERS</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#4E1300"/>
    </radialGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bun3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4903A"/>
      <stop offset="100%" stop-color="#9C5B22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg3)" rx="20"/>
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#FF8A65" stroke-opacity="0.15" stroke-width="2" rx="15"/>
  <!-- Smoke wisps -->
  <path d="M300,180 Q320,140 340,170 Q360,130 380,165" fill="none" stroke="#fff" stroke-opacity="0.15" stroke-width="3"/>
  <path d="M420,170 Q440,130 460,160 Q480,120 500,155" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="3"/>
  <!-- Burger -->
  <g transform="translate(400,340)" filter="url(#shadow3)">
    <!-- Top bun -->
    <ellipse cx="0" cy="-60" rx="125" ry="52" fill="url(#bun3)"/>
    <ellipse cx="0" cy="-72" rx="115" ry="30" fill="#E8A94D" opacity="0.4"/>
    <!-- Seeds -->
    <ellipse cx="-35" cy="-82" rx="6" ry="4" fill="#FFF5DC"/>
    <ellipse cx="30" cy="-87" rx="6" ry="4" fill="#FFF5DC"/>
    <ellipse cx="60" cy="-77" rx="6" ry="4" fill="#FFF5DC"/>
    <!-- BBQ drizzle -->
    <path d="M-80,-25 Q-60,-30 -40,-22 Q-20,-30 0,-24 Q20,-30 40,-22 Q60,-30 80,-25" fill="none" stroke="#5D1700" stroke-width="5" stroke-linecap="round"/>
    <!-- Onion rings -->
    <ellipse cx="-40" cy="-15" rx="20" ry="8" fill="none" stroke="#E8C56D" stroke-width="4"/>
    <ellipse cx="30" cy="-12" rx="18" ry="7" fill="none" stroke="#E8C56D" stroke-width="4"/>
    <!-- Bacon strips -->
    <path d="M-100,0 Q-80,-8 -60,0 Q-40,-8 -20,0 Q0,-8 20,0 Q40,-8 60,0 Q80,-8 100,0" fill="none" stroke="#8B2500" stroke-width="8" stroke-linecap="round"/>
    <path d="M-90,12 Q-70,4 -50,12 Q-30,4 -10,12 Q10,4 30,12 Q50,4 70,12 Q90,4 110,12" fill="none" stroke="#A33000" stroke-width="7" stroke-linecap="round"/>
    <!-- Patty -->
    <ellipse cx="0" cy="30" rx="118" ry="25" fill="#4A2000"/>
    <ellipse cx="0" cy="25" rx="112" ry="18" fill="#6B3010" opacity="0.6"/>
    <!-- Bottom bun -->
    <rect x="-125" y="50" width="250" height="28" fill="url(#bun3)" rx="5"/>
    <ellipse cx="0" cy="78" rx="125" ry="12" fill="#9C5B22"/>
  </g>
  <!-- Text -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#fff" filter="url(#shadow3)">Bacon BBQ Burger</text>
  <text x="400" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#FFAB91" letter-spacing="3">JUSTBURGERS</text>
  <!-- Flame accents -->
  <path d="M100,700 Q110,670 105,650 Q120,670 115,700" fill="#FF5722" opacity="0.2"/>
  <path d="M700,690 Q710,660 705,640 Q720,660 715,690" fill="#FF5722" opacity="0.15"/>
</svg>
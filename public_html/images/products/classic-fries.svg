<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg9" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#A85600"/>
    </radialGradient>
    <filter id="shadow9" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg9)" rx="20"/>
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#FFF176" stroke-opacity="0.15" stroke-width="2" rx="15"/>
  <!-- Fries container -->
  <g transform="translate(400,350)" filter="url(#shadow9)">
    <!-- Container (red box) -->
    <path d="M-90,20 L-110,120 L110,120 L90,20 Z" fill="#D32F2F"/>
    <path d="M-90,20 L-110,120 L-95,120 L-75,20 Z" fill="#B71C1C" opacity="0.3"/>
    <path d="M90,20 L110,120 L95,120 L75,20 Z" fill="#E53935" opacity="0.3"/>
    <!-- JB logo on container -->
    <text x="0" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFCDD2">JB</text>
    <!-- Fries sticking out -->
    <rect x="-70" y="-80" width="14" height="110" fill="#FFD54F" rx="3" transform="rotate(-12,-63,-25)"/>
    <rect x="-45" y="-95" width="14" height="120" fill="#FFCA28" rx="3" transform="rotate(-5,-38,-35)"/>
    <rect x="-20" y="-100" width="14" height="125" fill="#FFD54F" rx="3" transform="rotate(2,-13,-37)"/>
    <rect x="5" y="-90" width="14" height="115" fill="#FFC107" rx="3" transform="rotate(-3,12,-32)"/>
    <rect x="28" y="-98" width="14" height="123" fill="#FFD54F" rx="3" transform="rotate(6,35,-36)"/>
    <rect x="50" y="-85" width="14" height="110" fill="#FFCA28" rx="3" transform="rotate(10,57,-30)"/>
    <rect x="-55" y="-70" width="12" height="95" fill="#FFC107" rx="3" transform="rotate(-8,-49,-22)"/>
    <rect x="38" y="-75" width="12" height="100" fill="#FFD54F" rx="3" transform="rotate(8,44,-25)"/>
    <!-- Salt sparkles -->
    <circle cx="-30" cy="-60" r="1.5" fill="#fff" opacity="0.7"/>
    <circle cx="20" cy="-70" r="1" fill="#fff" opacity="0.6"/>
    <circle cx="45" cy="-50" r="1.5" fill="#fff" opacity="0.5"/>
    <circle cx="-50" cy="-45" r="1" fill="#fff" opacity="0.6"/>
  </g>
  <!-- Text -->
  <text x="400" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#fff" filter="url(#shadow9)">Classic Fries</text>
  <text x="400" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#FFF176" letter-spacing="4">GOLDEN &amp; CRISPY</text>
  <text x="400" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#FFE0B2" letter-spacing="3">JUSTBURGERS</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0e08"/>
      <stop offset="50%" stop-color="#2d1810"/>
      <stop offset="100%" stop-color="#3d2218"/>
    </linearGradient>
    <linearGradient id="hbun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4903A"/>
      <stop offset="50%" stop-color="#C07A2E"/>
      <stop offset="100%" stop-color="#A0622A"/>
    </linearGradient>
    <linearGradient id="hpatty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B3F14"/>
      <stop offset="100%" stop-color="#4A2508"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0.6" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF8F00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0"/>
    </radialGradient>
    <filter id="hshadow"><feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1920" height="600" fill="url(#hbg)"/>
  <rect width="1920" height="600" fill="url(#hglow)"/>
  <!-- Bokeh lights -->
  <circle cx="300" cy="100" r="80" fill="#FF8F00" opacity="0.06"/>
  <circle cx="1600" cy="150" r="60" fill="#FFC107" opacity="0.05"/>
  <circle cx="100" cy="450" r="100" fill="#D4903A" opacity="0.04"/>
  <circle cx="1750" cy="480" r="70" fill="#FF6F00" opacity="0.05"/>
  <circle cx="960" cy="80" r="50" fill="#FFC107" opacity="0.04"/>
  <!-- Large burger right of center -->
  <g transform="translate(1100, 300)" filter="url(#hshadow)">
    <!-- Top bun -->
    <ellipse cx="0" cy="-100" rx="200" ry="85" fill="url(#hbun)"/>
    <ellipse cx="-10" cy="-125" rx="145" ry="40" fill="#E8A94D" opacity="0.25"/>
    <!-- Sesame seeds -->
    <ellipse cx="-70" cy="-140" rx="9" ry="5" fill="#FFF5DC" opacity="0.8" transform="rotate(-15,-70,-140)"/>
    <ellipse cx="30" cy="-148" rx="9" ry="5" fill="#FFF5DC" opacity="0.8" transform="rotate(10,30,-148)"/>
    <ellipse cx="100" cy="-130" rx="9" ry="5" fill="#FFF5DC" opacity="0.8" transform="rotate(20,100,-130)"/>
    <ellipse cx="-30" cy="-150" rx="8" ry="4.5" fill="#FFF5DC" opacity="0.75" transform="rotate(-5,-30,-150)"/>
    <ellipse cx="-130" cy="-120" rx="8" ry="4.5" fill="#FFF5DC" opacity="0.7" transform="rotate(-20,-130,-120)"/>
    <ellipse cx="60" cy="-145" rx="8" ry="4.5" fill="#FFF5DC" opacity="0.7" transform="rotate(8,60,-145)"/>
    <!-- Lettuce -->
    <path d="M-210,-35 Q-160,-60 -110,-30 Q-60,-58 -10,-32 Q40,-58 90,-30 Q140,-55 190,-30 L200,-15 Q150,-38 100,-12 Q50,-38 0,-14 Q-50,-38 -105,-14 Q-155,-35 -210,-15 Z" fill="#4CAF50"/>
    <!-- Tomato -->
    <ellipse cx="-90" cy="-12" rx="45" ry="11" fill="#E53935"/>
    <ellipse cx="70" cy="-10" rx="40" ry="10" fill="#EF5350"/>
    <!-- Cheese melting -->
    <path d="M-195,5 L195,5 L195,20 Q165,20 155,40 Q150,48 145,20 L80,20 Q72,20 68,35 Q64,45 60,20 L-70,20 Q-75,20 -80,38 Q-85,50 -90,20 L-160,20 Q-165,20 -170,32 Q-175,42 -178,20 L-195,20 Z" fill="#FFC107"/>
    <!-- Patty -->
    <ellipse cx="0" cy="35" rx="190" ry="38" fill="url(#hpatty)"/>
    <line x1="-110" y1="28" x2="-70" y2="28" stroke="#3E1E06" stroke-width="2.5" opacity="0.3"/>
    <line x1="-30" y1="30" x2="10" y2="30" stroke="#3E1E06" stroke-width="2.5" opacity="0.3"/>
    <line x1="50" y1="28" x2="90" y2="28" stroke="#3E1E06" stroke-width="2.5" opacity="0.3"/>
    <!-- Bottom bun -->
    <rect x="-200" y="65" width="400" height="38" fill="#A0622A" rx="5"/>
    <ellipse cx="0" cy="103" rx="200" ry="18" fill="#8B5A1E"/>
    <rect x="-190" y="67" width="380" height="7" fill="#C07A2E" opacity="0.2" rx="3"/>
  </g>
  <!-- Floating fries on left -->
  <g transform="translate(350, 380) rotate(-15)" opacity="0.4">
    <rect x="0" y="0" width="12" height="80" rx="3" fill="#FFC107" transform="rotate(-10)"/>
    <rect x="20" y="-10" width="12" height="85" rx="3" fill="#E8A94D" transform="rotate(5)"/>
    <rect x="40" y="5" width="12" height="75" rx="3" fill="#FFD54F" transform="rotate(-5)"/>
    <rect x="-15" y="10" width="12" height="70" rx="3" fill="#D4903A" transform="rotate(8)"/>
  </g>
  <!-- Steam wisps -->
  <g opacity="0.08">
    <path d="M1020,120 Q1040,80 1060,110 Q1080,70 1100,100" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M1080,100 Q1100,60 1120,90 Q1140,50 1160,80" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M1140,115 Q1160,80 1180,108" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Scattered ingredients -->
  <circle cx="1650" cy="400" r="25" fill="#E53935" opacity="0.2"/>
  <ellipse cx="500" cy="150" rx="20" ry="20" fill="#4CAF50" opacity="0.15"/>
  <ellipse cx="1800" cy="250" rx="15" ry="15" fill="#FFC107" opacity="0.12"/>
</svg>
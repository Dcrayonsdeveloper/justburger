<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <linearGradient id="ambg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1810"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="amphone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="amscreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#f5f0e8"/>
    </linearGradient>
    <linearGradient id="ambun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4903A"/>
      <stop offset="100%" stop-color="#A0622A"/>
    </linearGradient>
    <linearGradient id="ampatty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B3F14"/>
      <stop offset="100%" stop-color="#4A2508"/>
    </linearGradient>
    <linearGradient id="amcta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="amheader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BF360C"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="amshadow" x="-15%" y="-5%" width="130%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="aminner" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="amscreenclip">
      <rect x="52" y="60" width="196" height="370" rx="4"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="300" height="500" fill="url(#ambg)"/>

  <!-- Phone body with shadow -->
  <g filter="url(#amshadow)">
    <rect x="40" y="30" width="220" height="440" rx="28" fill="url(#amphone)"/>
    <rect x="42" y="32" width="216" height="436" rx="26" fill="none" stroke="#444" stroke-width="0.5"/>
    <!-- Side buttons -->
    <rect x="38" y="120" width="3" height="30" rx="1.5" fill="#333"/>
    <rect x="38" y="170" width="3" height="50" rx="1.5" fill="#333"/>
    <rect x="259" y="150" width="3" height="40" rx="1.5" fill="#333"/>
  </g>

  <!-- Screen area -->
  <rect x="52" y="60" width="196" height="370" rx="4" fill="url(#amscreen)"/>

  <!-- Clipped screen content -->
  <g clip-path="url(#amscreenclip)">
    <!-- Status bar -->
    <rect x="52" y="60" width="196" height="22" fill="#f8f8f8"/>
    <!-- Status bar dots -->
    <circle cx="68" cy="71" r="2" fill="#999"/>
    <circle cx="74" cy="71" r="2" fill="#999"/>
    <circle cx="80" cy="71" r="2" fill="#999"/>
    <!-- Battery icon -->
    <rect x="222" y="68" width="14" height="7" rx="1.5" fill="none" stroke="#666" stroke-width="0.8"/>
    <rect x="236" y="70" width="2" height="3" rx="0.5" fill="#666"/>
    <rect x="224" y="70" width="9" height="3" rx="0.5" fill="#4CAF50"/>
    <!-- Signal bars -->
    <g transform="translate(62, 68)">
      <rect x="0" y="5" width="2" height="2" fill="#666"/>
      <rect x="3" y="3.5" width="2" height="3.5" fill="#666"/>
      <rect x="6" y="2" width="2" height="5" fill="#666"/>
      <rect x="9" y="0" width="2" height="7" fill="#666"/>
    </g>

    <!-- App header -->
    <rect x="52" y="82" width="196" height="44" fill="url(#amheader)"/>
    <!-- Hamburger menu icon -->
    <g transform="translate(66, 98)">
      <rect x="0" y="0" width="14" height="2" rx="1" fill="#fff"/>
      <rect x="0" y="5" width="14" height="2" rx="1" fill="#fff"/>
      <rect x="0" y="10" width="14" height="2" rx="1" fill="#fff"/>
    </g>
    <!-- Logo placeholder (burger icon instead of text) -->
    <g transform="translate(140, 104)">
      <ellipse cx="0" cy="-5" rx="12" ry="6" fill="#D4903A"/>
      <rect x="-12" y="-2" width="24" height="3" fill="#4CAF50" rx="1"/>
      <ellipse cx="0" cy="3" rx="11" ry="5" fill="#5D2F0E"/>
      <rect x="-12" y="6" width="24" height="4" fill="#A0622A" rx="1"/>
    </g>
    <!-- Cart icon -->
    <g transform="translate(222, 96)">
      <path d="M0,2 L3,0 L15,0 L18,2 L16,12 L2,12 Z" fill="none" stroke="#fff" stroke-width="1.2"/>
      <circle cx="5" cy="15" r="2" fill="#fff"/>
      <circle cx="13" cy="15" r="2" fill="#fff"/>
    </g>
    <!-- Cart badge -->
    <circle cx="236" cy="94" r="6" fill="#FFC107"/>

    <!-- Featured burger card -->
    <rect x="62" y="136" width="176" height="140" rx="10" fill="#FFF8E1"/>
    <!-- Burger image area -->
    <rect x="62" y="136" width="176" height="90" rx="10" fill="#5a3a28"/>
    <rect x="62" y="216" width="176" height="10" fill="#5a3a28"/>
    <!-- Burger illustration -->
    <g transform="translate(150, 180)" filter="url(#aminner)">
      <ellipse cx="0" cy="-22" rx="42" ry="18" fill="url(#ambun)"/>
      <ellipse cx="0" cy="-27" rx="32" ry="10" fill="#E8A94D" opacity="0.3"/>
      <ellipse cx="-10" cy="-30" rx="3" ry="1.8" fill="#FFF5DC" opacity="0.7"/>
      <ellipse cx="8" cy="-31" rx="3" ry="1.8" fill="#FFF5DC" opacity="0.7"/>
      <ellipse cx="20" cy="-27" rx="2.5" ry="1.5" fill="#FFF5DC" opacity="0.6"/>
      <path d="M-45,-5 Q-32,-14 -18,-3 Q-5,-14 8,-4 Q20,-14 33,-4 Q42,-10 45,-5 L45,2 Q35,-6 24,4 Q12,-6 0,4 Q-12,-6 -24,4 Q-35,-4 -45,2 Z" fill="#4CAF50"/>
      <rect x="-44" y="2" width="88" height="7" fill="#FFC107" rx="1"/>
      <ellipse cx="0" cy="15" rx="40" ry="11" fill="url(#ampatty)"/>
      <rect x="-42" y="22" width="84" height="12" fill="#C07A2E" rx="3"/>
      <ellipse cx="0" cy="34" rx="42" ry="6" fill="#8B5A1E"/>
    </g>
    <!-- Price badge (colored circle, no text) -->
    <circle cx="210" cy="152" r="14" fill="#E53935"/>
    <!-- Placeholder lines for name/description -->
    <rect x="72" y="236" width="100" height="8" rx="3" fill="#3d2b1f" opacity="0.6"/>
    <rect x="72" y="250" width="140" height="6" rx="3" fill="#8B7355" opacity="0.4"/>

    <!-- Order button (solid, no text) -->
    <rect x="62" y="268" width="176" height="36" rx="18" fill="url(#amcta)"/>
    <!-- Arrow icon on button -->
    <g transform="translate(142, 286)">
      <path d="M-8,-5 L8,0 L-8,5 Z" fill="#fff"/>
    </g>

    <!-- Quick categories row -->
    <g transform="translate(62, 316)">
      <!-- Category 1: burger icon -->
      <g>
        <circle cx="22" cy="16" r="16" fill="#FFF3E0"/>
        <ellipse cx="22" cy="13" rx="9" ry="4.5" fill="#D4903A"/>
        <rect x="13" y="14" width="18" height="2" fill="#4CAF50" rx="1"/>
        <ellipse cx="22" cy="19" rx="8" ry="4" fill="#5D2F0E"/>
      </g>
      <!-- Category 2: fries icon -->
      <g>
        <circle cx="72" cy="16" r="16" fill="#FFF3E0"/>
        <rect x="65" y="6" width="4" height="16" rx="1.5" fill="#FFC107"/>
        <rect x="70" y="4" width="4" height="18" rx="1.5" fill="#E8A94D"/>
        <rect x="75" y="7" width="4" height="15" rx="1.5" fill="#FFD54F"/>
      </g>
      <!-- Category 3: drink icon -->
      <g>
        <circle cx="122" cy="16" r="16" fill="#FFF3E0"/>
        <path d="M115,10 L117,26 L127,26 L129,10 Z" fill="#E53935" opacity="0.8"/>
        <ellipse cx="122" cy="10" rx="7" ry="2.5" fill="#ddd"/>
      </g>
      <!-- Category 4: dessert icon -->
      <g>
        <circle cx="165" cy="16" r="16" fill="#FFF3E0"/>
        <path d="M159,22 L165,8 L171,22 Z" fill="#F8BBD0"/>
        <circle cx="165" cy="8" r="3" fill="#E53935"/>
        <rect x="159" y="22" width="12" height="3" rx="1" fill="#D4903A"/>
      </g>
    </g>
    <!-- Category placeholder bars -->
    <g transform="translate(62, 348)">
      <rect x="8" y="0" width="28" height="4" rx="2" fill="#bbb" opacity="0.4"/>
      <rect x="58" y="0" width="28" height="4" rx="2" fill="#bbb" opacity="0.4"/>
      <rect x="108" y="0" width="28" height="4" rx="2" fill="#bbb" opacity="0.4"/>
      <rect x="151" y="0" width="28" height="4" rx="2" fill="#bbb" opacity="0.4"/>
    </g>

    <!-- Bottom nav bar -->
    <rect x="52" y="400" width="196" height="30" fill="#fff"/>
    <line x1="52" y1="400" x2="248" y2="400" stroke="#e0e0e0" stroke-width="0.5"/>
    <!-- Home icon (active) -->
    <g transform="translate(82, 408)">
      <path d="M8,0 L16,7 L14,7 L14,14 L2,14 L2,7 L0,7 Z" fill="#E53935"/>
    </g>
    <!-- Search icon -->
    <g transform="translate(128, 408)">
      <circle cx="7" cy="6" r="5" fill="none" stroke="#999" stroke-width="1.5"/>
      <line x1="11" y1="10" x2="15" y2="14" stroke="#999" stroke-width="1.5"/>
    </g>
    <!-- Profile icon -->
    <g transform="translate(180, 408)">
      <circle cx="8" cy="4" r="4" fill="none" stroke="#999" stroke-width="1.2"/>
      <path d="M0,14 Q0,8 8,8 Q16,8 16,14" fill="none" stroke="#999" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Camera notch -->
  <rect x="120" y="34" width="60" height="18" rx="9" fill="#111"/>
  <circle cx="150" cy="43" r="5" fill="#1a1a1a"/>
  <circle cx="150" cy="43" r="3" fill="#0d0d0d"/>
  <circle cx="150" cy="43" r="1.5" fill="#1f1f3d" opacity="0.5"/>

  <!-- Home indicator bar -->
  <rect x="115" y="440" width="70" height="4" rx="2" fill="#333"/>
</svg>
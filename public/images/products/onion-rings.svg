<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg11" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#E8A94D"/>
      <stop offset="100%" stop-color="#7A4A0A"/>
    </radialGradient>
    <filter id="shadow11" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg11)" rx="20"/>
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#FFE0B2" stroke-opacity="0.15" stroke-width="2" rx="15"/>
  <!-- Onion rings pile -->
  <g transform="translate(400,340)" filter="url(#shadow11)">
    <!-- Back rings -->
    <ellipse cx="-40" cy="30" rx="55" ry="22" fill="none" stroke="#D4903A" stroke-width="18" transform="rotate(-10,-40,30)"/>
    <ellipse cx="-40" cy="30" rx="55" ry="22" fill="none" stroke="#E8A94D" stroke-width="10" opacity="0.4" transform="rotate(-10,-40,30)"/>
    <ellipse cx="50" cy="25" rx="50" ry="20" fill="none" stroke="#C88030" stroke-width="18" transform="rotate(8,50,25)"/>
    <ellipse cx="50" cy="25" rx="50" ry="20" fill="none" stroke="#D4903A" stroke-width="10" opacity="0.4" transform="rotate(8,50,25)"/>
    <!-- Middle rings -->
    <ellipse cx="0" cy="0" rx="58" ry="24" fill="none" stroke="#D4903A" stroke-width="20" transform="rotate(-5,0,0)"/>
    <ellipse cx="0" cy="0" rx="58" ry="24" fill="none" stroke="#E8A94D" stroke-width="12" opacity="0.4" transform="rotate(-5,0,0)"/>
    <!-- Front rings -->
    <ellipse cx="-30" cy="-25" rx="52" ry="20" fill="none" stroke="#C88030" stroke-width="18" transform="rotate(12,-30,-25)"/>
    <ellipse cx="-30" cy="-25" rx="52" ry="20" fill="none" stroke="#D4903A" stroke-width="10" opacity="0.5" transform="rotate(12,-30,-25)"/>
    <ellipse cx="40" cy="-20" rx="48" ry="18" fill="none" stroke="#D4903A" stroke-width="16" transform="rotate(-8,40,-20)"/>
    <ellipse cx="40" cy="-20" rx="48" ry="18" fill="none" stroke="#E8A94D" stroke-width="9" opacity="0.4" transform="rotate(-8,40,-20)"/>
    <!-- Top ring standing up -->
    <ellipse cx="5" cy="-60" rx="45" ry="20" fill="none" stroke="#D4903A" stroke-width="18" transform="rotate(75,5,-60)"/>
    <ellipse cx="5" cy="-60" rx="45" ry="20" fill="none" stroke="#E8A94D" stroke-width="10" opacity="0.4" transform="rotate(75,5,-60)"/>
    <!-- Crumb texture -->
    <circle cx="-60" cy="-15" r="2" fill="#C88030" opacity="0.6"/>
    <circle cx="70" cy="5" r="2.5" fill="#C88030" opacity="0.5"/>
    <circle cx="-20" cy="40" r="2" fill="#C88030" opacity="0.6"/>
    <circle cx="30" cy="45" r="1.5" fill="#C88030" opacity="0.5"/>
  </g>
  <!-- Text -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#fff" filter="url(#shadow11)">Onion Rings</text>
  <text x="400" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#FFE0B2" letter-spacing="4">CRISPY PERFECTION</text>
  <text x="400" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#FFE0B2" letter-spacing="3">JUSTBURGERS</text>
</svg>
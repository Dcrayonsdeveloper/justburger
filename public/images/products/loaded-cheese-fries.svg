<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg10" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#7A3A00"/>
    </radialGradient>
    <filter id="shadow10" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg10)" rx="20"/>
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#FFE082" stroke-opacity="0.15" stroke-width="2" rx="15"/>
  <!-- Loaded fries basket -->
  <g transform="translate(400,330)" filter="url(#shadow10)">
    <!-- Basket/tray -->
    <path d="M-140,50 L-150,110 L150,110 L140,50 Z" fill="#5D4037" rx="5"/>
    <path d="M-150,110 L150,110 L145,115 L-145,115 Z" fill="#4E342E"/>
    <!-- Fries base -->
    <rect x="-100" y="-20" width="16" height="80" fill="#FFD54F" rx="3" transform="rotate(-15,-92,20)"/>
    <rect x="-70" y="-30" width="16" height="90" fill="#FFCA28" rx="3" transform="rotate(-8,-62,15)"/>
    <rect x="-40" y="-25" width="16" height="85" fill="#FFD54F" rx="3" transform="rotate(-2,-32,17)"/>
    <rect x="-10" y="-35" width="16" height="95" fill="#FFC107" rx="3" transform="rotate(3,-2,12)"/>
    <rect x="20" y="-28" width="16" height="88" fill="#FFD54F" rx="3" transform="rotate(5,28,16)"/>
    <rect x="50" y="-22" width="16" height="82" fill="#FFCA28" rx="3" transform="rotate(10,58,19)"/>
    <rect x="80" y="-15" width="16" height="75" fill="#FFD54F" rx="3" transform="rotate(14,88,22)"/>
    <!-- Cheese sauce drizzle -->
    <path d="M-100,10 Q-70,0 -40,15 Q-10,-5 20,10 Q50,0 80,18 Q110,5 120,10" fill="none" stroke="#FF8F00" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <path d="M-90,30 Q-60,20 -30,35 Q0,15 30,28 Q60,18 90,32" fill="none" stroke="#FFA000" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <!-- Bacon bits -->
    <rect x="-60" y="5" width="15" height="6" fill="#8B2500" rx="2" transform="rotate(-20,-52,8)"/>
    <rect x="10" y="0" width="12" height="5" fill="#A33000" rx="2" transform="rotate(15,16,2)"/>
    <rect x="60" y="8" width="14" height="6" fill="#8B2500" rx="2" transform="rotate(-10,67,11)"/>
    <rect x="-30" y="20" width="13" height="5" fill="#A33000" rx="2" transform="rotate(25,-23,22)"/>
    <!-- Green onion -->
    <circle cx="-45" cy="15" r="4" fill="#4CAF50"/>
    <circle cx="35" cy="10" r="3" fill="#66BB6A"/>
    <circle cx="75" cy="25" r="3.5" fill="#4CAF50"/>
  </g>
  <!-- Text -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#fff" filter="url(#shadow10)">Loaded Cheese Fries</text>
  <text x="400" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#FFE082" letter-spacing="3">JUSTBURGERS</text>
</svg>
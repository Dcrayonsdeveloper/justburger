<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F44336"/>
      <stop offset="100%" stop-color="#7F0000"/>
    </radialGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bun5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4903A"/>
      <stop offset="100%" stop-color="#A0622A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg5)" rx="20"/>
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#FF8A80" stroke-opacity="0.2" stroke-width="2" rx="15"/>
  <!-- Fire particles -->
  <circle cx="150" cy="200" r="4" fill="#FF9800" opacity="0.4"/>
  <circle cx="650" cy="180" r="3" fill="#FFC107" opacity="0.3"/>
  <circle cx="200" cy="150" r="2" fill="#FFEB3B" opacity="0.5"/>
  <circle cx="600" cy="220" r="3" fill="#FF5722" opacity="0.35"/>
  <!-- Burger -->
  <g transform="translate(400,340)" filter="url(#shadow5)">
    <!-- Top bun -->
    <ellipse cx="0" cy="-60" rx="122" ry="50" fill="url(#bun5)"/>
    <ellipse cx="0" cy="-70" rx="112" ry="30" fill="#E8A94D" opacity="0.4"/>
    <!-- Seeds -->
    <ellipse cx="-38" cy="-82" rx="6" ry="4" fill="#FFF5DC"/>
    <ellipse cx="22" cy="-86" rx="6" ry="4" fill="#FFF5DC"/>
    <ellipse cx="55" cy="-76" rx="6" ry="4" fill="#FFF5DC"/>
    <!-- Jalapeno slices -->
    <circle cx="-60" cy="-20" r="12" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
    <circle cx="-60" cy="-20" r="6" fill="#4CAF50"/>
    <circle cx="-20" cy="-22" r="11" fill="#388E3C" stroke="#1B5E20" stroke-width="2"/>
    <circle cx="-20" cy="-22" r="5" fill="#66BB6A"/>
    <circle cx="25" cy="-18" r="12" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
    <circle cx="25" cy="-18" r="6" fill="#4CAF50"/>
    <circle cx="65" cy="-21" r="10" fill="#388E3C" stroke="#1B5E20" stroke-width="2"/>
    <circle cx="65" cy="-21" r="5" fill="#66BB6A"/>
    <!-- Pepper jack cheese -->
    <rect x="-120" y="-5" width="240" height="20" fill="#FFECB3" rx="3"/>
    <circle cx="-50" cy="5" r="3" fill="#FF6F00" opacity="0.5"/>
    <circle cx="30" cy="8" r="2" fill="#FF6F00" opacity="0.4"/>
    <circle cx="80" cy="3" r="2.5" fill="#FF6F00" opacity="0.45"/>
    <!-- Patty -->
    <ellipse cx="0" cy="28" rx="115" ry="25" fill="#5D2F0E"/>
    <!-- Bottom bun -->
    <rect x="-122" y="48" width="244" height="28" fill="url(#bun5)" rx="5"/>
    <ellipse cx="0" cy="76" rx="122" ry="12" fill="#A0622A"/>
  </g>
  <!-- Chili pepper icon -->
  <g transform="translate(680,680) rotate(-30)">
    <path d="M0,0 Q-5,-25 -3,-45 Q0,-50 3,-45 Q5,-25 0,0" fill="#D32F2F"/>
    <path d="M-2,-45 Q0,-55 2,-45" fill="#2E7D32" stroke="#1B5E20" stroke-width="1"/>
  </g>
  <!-- Text -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#fff" filter="url(#shadow5)">Spicy Jalapeno</text>
  <text x="400" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#FFCDD2" letter-spacing="5">BRING THE HEAT</text>
  <text x="400" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#FFCDD2" letter-spacing="3">JUSTBURGERS</text>
</svg>
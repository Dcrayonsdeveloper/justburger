<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </radialGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bun1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4903A"/>
      <stop offset="100%" stop-color="#A0622A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg1)" rx="20"/>
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#fff" stroke-opacity="0.15" stroke-width="2" rx="15"/>
  <!-- Burger icon -->
  <g transform="translate(400,340)" filter="url(#shadow1)">
    <!-- Top bun -->
    <ellipse cx="0" cy="-60" rx="120" ry="50" fill="url(#bun1)"/>
    <ellipse cx="0" cy="-70" rx="110" ry="30" fill="#E8A94D" opacity="0.5"/>
    <!-- Sesame seeds -->
    <ellipse cx="-40" cy="-80" rx="6" ry="4" fill="#FFF5DC" transform="rotate(-15,-40,-80)"/>
    <ellipse cx="20" cy="-85" rx="6" ry="4" fill="#FFF5DC" transform="rotate(10,20,-85)"/>
    <ellipse cx="50" cy="-75" rx="6" ry="4" fill="#FFF5DC" transform="rotate(20,50,-75)"/>
    <ellipse cx="-15" cy="-90" rx="6" ry="4" fill="#FFF5DC" transform="rotate(-5,-15,-90)"/>
    <!-- Lettuce -->
    <path d="M-130,-25 Q-100,-40 -70,-20 Q-40,-40 0,-22 Q40,-40 70,-20 Q100,-40 130,-25 L130,-15 Q100,-30 70,-10 Q40,-30 0,-12 Q-40,-30 -70,-10 Q-100,-30 -130,-15 Z" fill="#4CAF50"/>
    <!-- Cheese -->
    <rect x="-125" y="-20" width="250" height="20" fill="#FFC107" rx="3"/>
    <path d="M-125,0 L-135,20 L-125,0" fill="#FFC107"/>
    <path d="M125,0 L135,20 L125,0" fill="#FFC107"/>
    <!-- Patty -->
    <ellipse cx="0" cy="15" rx="115" ry="25" fill="#5D2F0E"/>
    <ellipse cx="0" cy="10" rx="110" ry="18" fill="#7B3F14" opacity="0.6"/>
    <!-- Bottom bun -->
    <rect x="-120" y="35" width="240" height="30" fill="url(#bun1)" rx="5"/>
    <ellipse cx="0" cy="65" rx="120" ry="12" fill="#A0622A"/>
  </g>
  <!-- Text -->
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#fff" filter="url(#shadow1)">Classic Cheeseburger</text>
  <text x="400" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#FFE0B2" letter-spacing="3">JUSTBURGERS</text>
  <!-- Corner accents -->
  <circle cx="80" cy="80" r="30" fill="#FFC107" opacity="0.15"/>
  <circle cx="720" cy="720" r="40" fill="#FF5722" opacity="0.1"/>
</svg>
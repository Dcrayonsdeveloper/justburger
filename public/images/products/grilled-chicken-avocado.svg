<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg7" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#33691E"/>
    </radialGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bun7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4903A"/>
      <stop offset="100%" stop-color="#A0622A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg7)" rx="20"/>
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#C5E1A5" stroke-opacity="0.2" stroke-width="2" rx="15"/>
  <!-- Burger -->
  <g transform="translate(400,340)" filter="url(#shadow7)">
    <!-- Top bun (multi-grain style) -->
    <ellipse cx="0" cy="-58" rx="120" ry="48" fill="url(#bun7)"/>
    <ellipse cx="0" cy="-68" rx="110" ry="28" fill="#D4A04D" opacity="0.4"/>
    <!-- Seeds (varied) -->
    <ellipse cx="-40" cy="-80" rx="5" ry="3" fill="#FFF5DC"/>
    <ellipse cx="20" cy="-84" rx="4" ry="3" fill="#8D6E63"/>
    <ellipse cx="50" cy="-76" rx="5" ry="3" fill="#FFF5DC"/>
    <ellipse cx="-10" cy="-86" rx="4" ry="3" fill="#8D6E63"/>
    <!-- Avocado slices -->
    <ellipse cx="-55" cy="-22" rx="25" ry="12" fill="#7CB342"/>
    <ellipse cx="-55" cy="-22" rx="18" ry="8" fill="#9CCC65" opacity="0.6"/>
    <ellipse cx="-10" cy="-20" rx="23" ry="11" fill="#689F38"/>
    <ellipse cx="-10" cy="-20" rx="16" ry="7" fill="#8BC34A" opacity="0.6"/>
    <ellipse cx="40" cy="-23" rx="24" ry="12" fill="#7CB342"/>
    <ellipse cx="40" cy="-23" rx="17" ry="8" fill="#9CCC65" opacity="0.6"/>
    <!-- Lettuce -->
    <path d="M-125,-5 Q-95,-15 -65,-2 Q-35,-15 0,-4 Q35,-15 65,-2 Q95,-15 125,-5 L125,2 Q95,-8 65,5 Q35,-8 0,3 Q-35,-8 -65,5 Q-95,-8 -125,2 Z" fill="#4CAF50"/>
    <!-- Grilled chicken (with grill marks) -->
    <ellipse cx="0" cy="20" rx="108" ry="26" fill="#C8933A"/>
    <line x1="-70" y1="12" x2="-70" y2="28" stroke="#A0720A" stroke-width="3" opacity="0.6"/>
    <line x1="-40" y1="10" x2="-40" y2="30" stroke="#A0720A" stroke-width="3" opacity="0.6"/>
    <line x1="-10" y1="10" x2="-10" y2="30" stroke="#A0720A" stroke-width="3" opacity="0.6"/>
    <line x1="20" y1="10" x2="20" y2="30" stroke="#A0720A" stroke-width="3" opacity="0.6"/>
    <line x1="50" y1="12" x2="50" y2="28" stroke="#A0720A" stroke-width="3" opacity="0.6"/>
    <!-- Bottom bun -->
    <rect x="-120" y="42" width="240" height="28" fill="url(#bun7)" rx="5"/>
    <ellipse cx="0" cy="70" rx="120" ry="12" fill="#A0622A"/>
  </g>
  <!-- Text -->
  <text x="400" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#fff" filter="url(#shadow7)">Grilled Chicken</text>
  <text x="400" y="595" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#fff" filter="url(#shadow7)">Avocado</text>
  <text x="400" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#C5E1A5" letter-spacing="3">JUSTBURGERS</text>
</svg>
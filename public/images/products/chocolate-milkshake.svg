<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg12" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </radialGradient>
    <filter id="shadow12" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="glass12" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg12)" rx="20"/>
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#BCAAA4" stroke-opacity="0.15" stroke-width="2" rx="15"/>
  <!-- Milkshake glass -->
  <g transform="translate(400,340)" filter="url(#shadow12)">
    <!-- Glass body -->
    <path d="M-60,-60 L-75,120 Q-75,140 0,140 Q75,140 75,120 L60,-60 Z" fill="#5D4037"/>
    <path d="M-60,-60 L-75,120 Q-75,140 0,140 Q75,140 75,120 L60,-60 Z" fill="url(#glass12)"/>
    <!-- Chocolate shake fill -->
    <path d="M-58,-50 L-73,115 Q-73,135 0,135 Q73,135 73,115 L58,-50 Z" fill="#4E342E"/>
    <!-- Shine on glass -->
    <path d="M-50,-50 L-55,80 L-45,80 L-40,-50 Z" fill="#fff" opacity="0.08"/>
    <!-- Whipped cream top -->
    <ellipse cx="0" cy="-60" rx="65" ry="20" fill="#FAFAFA"/>
    <ellipse cx="-20" cy="-70" rx="30" ry="18" fill="#F5F5F5"/>
    <ellipse cx="20" cy="-72" rx="28" ry="16" fill="#FAFAFA"/>
    <ellipse cx="0" cy="-78" rx="22" ry="14" fill="#fff"/>
    <!-- Cherry on top -->
    <circle cx="0" cy="-92" r="12" fill="#D32F2F"/>
    <circle cx="-3" cy="-95" r="4" fill="#E53935" opacity="0.6"/>
    <path d="M0,-104 Q5,-112 8,-108" fill="none" stroke="#2E7D32" stroke-width="2"/>
    <!-- Straw -->
    <rect x="20" y="-130" width="8" height="200" fill="#F44336" rx="2" transform="rotate(8,24,-30)"/>
    <rect x="20" y="-130" width="4" height="200" fill="#E53935" rx="1" transform="rotate(8,24,-30)" opacity="0.5"/>
    <!-- Chocolate drip -->
    <path d="M-55,-55 Q-58,-45 -56,-40" fill="none" stroke="#3E2723" stroke-width="4" stroke-linecap="round"/>
    <path d="M50,-55 Q53,-48 51,-42" fill="none" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>
    <!-- Chocolate sprinkles on cream -->
    <rect x="-30" y="-68" width="6" height="2" fill="#5D4037" rx="1" transform="rotate(-30)"/>
    <rect x="15" y="-65" width="5" height="2" fill="#5D4037" rx="1" transform="rotate(20)"/>
    <rect x="-5" y="-75" width="6" height="2" fill="#5D4037" rx="1" transform="rotate(-10)"/>
  </g>
  <!-- Text -->
  <text x="400" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#fff" filter="url(#shadow12)">Chocolate Milkshake</text>
  <text x="400" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#BCAAA4" letter-spacing="4">THICK &amp; CREAMY</text>
  <text x="400" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#D7CCC8" letter-spacing="3">JUSTBURGERS</text>
</svg>
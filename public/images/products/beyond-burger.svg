<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg8" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    <filter id="shadow8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bun8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4903A"/>
      <stop offset="100%" stop-color="#A0622A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg8)" rx="20"/>
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#A5D6A7" stroke-opacity="0.2" stroke-width="2" rx="15"/>
  <!-- Leaf decoration -->
  <g opacity="0.15">
    <path d="M120,120 Q140,100 160,120 Q140,115 120,120" fill="#fff" transform="rotate(-20,140,110)"/>
    <path d="M680,130 Q700,110 720,130 Q700,125 680,130" fill="#fff" transform="rotate(15,700,120)"/>
  </g>
  <!-- Burger -->
  <g transform="translate(400,340)" filter="url(#shadow8)">
    <!-- Top bun (whole wheat) -->
    <ellipse cx="0" cy="-58" rx="120" ry="48" fill="#B8860B"/>
    <ellipse cx="0" cy="-68" rx="110" ry="28" fill="#C8960B" opacity="0.4"/>
    <!-- Seeds -->
    <ellipse cx="-35" cy="-80" rx="5" ry="3" fill="#FFF5DC"/>
    <ellipse cx="25" cy="-84" rx="5" ry="3" fill="#FFF5DC"/>
    <ellipse cx="55" cy="-76" rx="5" ry="3" fill="#FFF5DC"/>
    <!-- Lettuce -->
    <path d="M-125,-22 Q-95,-35 -65,-18 Q-35,-35 0,-20 Q35,-35 65,-18 Q95,-35 125,-22 L125,-12 Q95,-25 65,-8 Q35,-25 0,-10 Q-35,-25 -65,-8 Q-95,-25 -125,-12 Z" fill="#43A047"/>
    <!-- Tomato -->
    <ellipse cx="-30" cy="-5" rx="28" ry="7" fill="#E53935"/>
    <ellipse cx="40" cy="-3" rx="25" ry="6" fill="#EF5350"/>
    <!-- Plant-based patty -->
    <ellipse cx="0" cy="20" rx="112" ry="25" fill="#5D4037"/>
    <ellipse cx="0" cy="16" rx="105" ry="18" fill="#6D4C41" opacity="0.5"/>
    <!-- "Plant" texture dots -->
    <circle cx="-50" cy="18" r="3" fill="#8BC34A" opacity="0.3"/>
    <circle cx="30" cy="15" r="2.5" fill="#8BC34A" opacity="0.3"/>
    <circle cx="-20" cy="22" r="2" fill="#8BC34A" opacity="0.25"/>
    <circle cx="60" cy="20" r="3" fill="#8BC34A" opacity="0.3"/>
    <!-- Bottom bun -->
    <rect x="-120" y="40" width="240" height="28" fill="#B8860B" rx="5"/>
    <ellipse cx="0" cy="68" rx="120" ry="12" fill="#9A7209"/>
  </g>
  <!-- Plant-based badge -->
  <g transform="translate(650,150)">
    <circle r="45" fill="#2E7D32" opacity="0.8"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">100%</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C8E6C9">PLANT</text>
    <text x="0" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C8E6C9">BASED</text>
  </g>
  <!-- Text -->
  <text x="400" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#fff" filter="url(#shadow8)">Beyond Burger</text>
  <text x="400" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#A5D6A7" letter-spacing="4">PLANT-POWERED</text>
  <text x="400" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#C8E6C9" letter-spacing="3">JUSTBURGERS</text>
</svg>
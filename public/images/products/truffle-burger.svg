<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg15" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4A148C"/>
      <stop offset="60%" stop-color="#1A0033"/>
      <stop offset="100%" stop-color="#0D001A"/>
    </radialGradient>
    <filter id="shadow15" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="bun15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="gold15" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg15)" rx="20"/>
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="url(#gold15)" stroke-opacity="0.25" stroke-width="2" rx="15"/>
  <!-- Gold sparkle accents -->
  <circle cx="150" cy="150" r="2" fill="#FFD700" opacity="0.5"/>
  <circle cx="650" cy="180" r="1.5" fill="#FFD700" opacity="0.4"/>
  <circle cx="200" cy="650" r="2" fill="#FFD700" opacity="0.35"/>
  <circle cx="600" cy="630" r="1.5" fill="#FFD700" opacity="0.45"/>
  <circle cx="700" cy="400" r="2" fill="#FFD700" opacity="0.3"/>
  <circle cx="100" cy="380" r="1.5" fill="#FFD700" opacity="0.4"/>
  <!-- Burger -->
  <g transform="translate(400,340)" filter="url(#shadow15)">
    <!-- Top bun (black/brioche) -->
    <ellipse cx="0" cy="-60" rx="122" ry="50" fill="url(#bun15)"/>
    <ellipse cx="0" cy="-70" rx="112" ry="28" fill="#2A2A2A" opacity="0.5"/>
    <!-- Gold sesame seeds -->
    <ellipse cx="-38" cy="-80" rx="6" ry="4" fill="#DAA520"/>
    <ellipse cx="22" cy="-85" rx="6" ry="4" fill="#FFD700"/>
    <ellipse cx="55" cy="-76" rx="6" ry="4" fill="#DAA520"/>
    <ellipse cx="-10" cy="-87" rx="6" ry="4" fill="#FFD700"/>
    <!-- Truffle aioli drizzle -->
    <path d="M-80,-25 Q-50,-32 -20,-22 Q10,-32 40,-24 Q70,-32 80,-25" fill="none" stroke="#F5F5DC" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- Arugula -->
    <path d="M-110,-15 Q-90,-25 -70,-12 Q-50,-22 -30,-14 Q-10,-22 10,-12 Q30,-22 50,-14 Q70,-22 90,-12 Q110,-22 110,-15" fill="#2E7D32" opacity="0.8"/>
    <!-- Gruyere cheese -->
    <rect x="-118" y="-8" width="236" height="18" fill="#FFE082" rx="3"/>
    <!-- Truffle shavings -->
    <ellipse cx="-50" cy="5" rx="12" ry="4" fill="#1A1A1A" transform="rotate(-20,-50,5)" opacity="0.8"/>
    <ellipse cx="10" cy="3" rx="10" ry="3.5" fill="#2A2A2A" transform="rotate(15,10,3)" opacity="0.7"/>
    <ellipse cx="55" cy="6" rx="11" ry="4" fill="#1A1A1A" transform="rotate(-10,55,6)" opacity="0.8"/>
    <!-- Premium patty -->
    <ellipse cx="0" cy="25" rx="115" ry="25" fill="#3E1500"/>
    <ellipse cx="0" cy="20" rx="108" ry="18" fill="#5D2100" opacity="0.5"/>
    <!-- Bottom bun -->
    <rect x="-122" y="45" width="244" height="28" fill="url(#bun15)" rx="5"/>
    <ellipse cx="0" cy="73" rx="122" ry="12" fill="#0D0D0D"/>
  </g>
  <!-- Premium badge -->
  <g transform="translate(660,140)">
    <circle r="42" fill="none" stroke="url(#gold15)" stroke-width="2"/>
    <circle r="38" fill="none" stroke="url(#gold15)" stroke-width="1" opacity="0.5"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FFD700">PREMIUM</text>
    <text x="0" y="12" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#DAA520">GOURMET</text>
  </g>
  <!-- Text -->
  <text x="400" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="url(#gold15)" filter="url(#shadow15)">Truffle Burger</text>
  <text x="400" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#DAA520" letter-spacing="6">BLACK TRUFFLE &amp; GRUYERE</text>
  <text x="400" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#B39DDB" letter-spacing="3">JUSTBURGERS</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="cbg8" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F48FB1"/>
      <stop offset="100%" stop-color="#6A1B4D"/>
    </radialGradient>
    <filter id="cshadow8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#cbg8)" rx="24"/>
  <!-- Sprinkle decorations -->
  <g opacity="0.2">
    <rect x="150" y="150" width="8" height="3" fill="#FFC107" rx="1.5" transform="rotate(-30,154,151)"/>
    <rect x="250" y="120" width="8" height="3" fill="#4CAF50" rx="1.5" transform="rotate(20,254,121)"/>
    <rect x="550" y="140" width="8" height="3" fill="#2196F3" rx="1.5" transform="rotate(-15,554,141)"/>
    <rect x="640" y="180" width="8" height="3" fill="#FF5722" rx="1.5" transform="rotate(40,644,181)"/>
    <rect x="160" y="600" width="8" height="3" fill="#E91E63" rx="1.5" transform="rotate(-25,164,601)"/>
    <rect x="630" y="620" width="8" height="3" fill="#FFC107" rx="1.5" transform="rotate(30,634,621)"/>
  </g>
  <circle cx="400" cy="330" r="180" fill="none" stroke="#F8BBD0" stroke-opacity="0.1" stroke-width="25"/>
  <!-- Ice cream sundae -->
  <g transform="translate(310,310)" filter="url(#cshadow8)">
    <!-- Glass -->
    <path d="M-40,0 L-50,100 Q-50,120 0,120 Q50,120 50,100 L40,0 Z" fill="#F8BBD0" opacity="0.3"/>
    <path d="M-40,0 L-50,100 Q-50,120 0,120 Q50,120 50,100 L40,0 Z" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="2"/>
    <!-- Ice cream scoops -->
    <circle cx="-15" cy="-15" r="35" fill="#FFF9C4"/>
    <circle cx="20" cy="-20" r="32" fill="#FFCCBC"/>
    <circle cx="0" cy="-45" r="30" fill="#D7CCC8"/>
    <!-- Cherry -->
    <circle cx="0" cy="-75" r="10" fill="#D32F2F"/>
    <path d="M0,-85 Q5,-92 8,-88" fill="none" stroke="#2E7D32" stroke-width="2"/>
    <!-- Chocolate sauce -->
    <path d="M-20,-35 Q-15,-25 -18,-15" fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
    <path d="M15,-30 Q18,-20 14,-10" fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
    <!-- Whipped cream -->
    <ellipse cx="0" cy="-50" rx="18" ry="8" fill="#fff" opacity="0.8"/>
  </g>
  <!-- Cookie -->
  <g transform="translate(520,340)" filter="url(#cshadow8)">
    <circle r="55" fill="#D4903A"/>
    <circle r="48" fill="#C88030" opacity="0.4"/>
    <!-- Chocolate chips -->
    <circle cx="-18" cy="-15" r="7" fill="#5D4037"/>
    <circle cx="15" cy="10" r="6" fill="#4E342E"/>
    <circle cx="-8" cy="20" r="7" fill="#5D4037"/>
    <circle cx="25" cy="-10" r="5" fill="#4E342E"/>
    <circle cx="-25" cy="8" r="5" fill="#5D4037"/>
    <circle cx="10" cy="-25" r="6" fill="#4E342E"/>
  </g>
  <!-- Label -->
  <rect x="220" y="525" width="360" height="70" fill="#000" fill-opacity="0.35" rx="35"/>
  <text x="400" y="568" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#fff">Desserts</text>
  <text x="400" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#F8BBD0" letter-spacing="4" opacity="0.8">SWEET ENDINGS</text>
</svg>
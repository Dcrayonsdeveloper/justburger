<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="cbg6" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#4A0028"/>
    </radialGradient>
    <filter id="cshadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="cglass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#cbg6)" rx="24"/>
  <!-- Bubbles -->
  <circle cx="200" cy="200" r="15" fill="#fff" opacity="0.05"/>
  <circle cx="600" cy="250" r="10" fill="#fff" opacity="0.04"/>
  <circle cx="180" cy="550" r="12" fill="#fff" opacity="0.04"/>
  <circle cx="620" cy="500" r="8" fill="#fff" opacity="0.05"/>
  <!-- Milkshake -->
  <g transform="translate(310,300)" filter="url(#cshadow6)">
    <path d="M-50,-60 L-65,120 Q-65,145 0,145 Q65,145 65,120 L50,-60 Z" fill="#8D6E63"/>
    <path d="M-50,-60 L-65,120 Q-65,145 0,145 Q65,145 65,120 L50,-60 Z" fill="url(#cglass)"/>
    <ellipse cx="0" cy="-60" rx="55" ry="18" fill="#FAFAFA"/>
    <ellipse cx="-15" cy="-70" rx="25" ry="15" fill="#F5F5F5"/>
    <ellipse cx="15" cy="-72" rx="22" ry="13" fill="#fff"/>
    <circle cx="0" cy="-85" r="10" fill="#D32F2F"/>
    <circle cx="-2" cy="-88" r="3.5" fill="#E53935" opacity="0.6"/>
    <rect x="15" y="-120" width="7" height="165" fill="#E91E63" rx="2" transform="rotate(6,18,-38)"/>
  </g>
  <!-- Soda cup -->
  <g transform="translate(520,310)" filter="url(#cshadow6)">
    <path d="M-40,-50 L-48,100 Q-48,115 0,115 Q48,115 48,100 L40,-50 Z" fill="#D32F2F"/>
    <path d="M-40,-50 L40,-50 L38,-44 L-38,-44 Z" fill="#B71C1C"/>
    <text x="0" y="40" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#FFCDD2">JB</text>
    <ellipse cx="0" cy="-50" rx="42" ry="10" fill="#E0E0E0"/>
    <rect x="-3" y="-100" width="6" height="55" fill="#BDBDBD" rx="1.5"/>
    <!-- Ice cubes visible -->
    <rect x="-20" y="-30" width="16" height="12" fill="#fff" opacity="0.15" rx="2"/>
    <rect x="10" y="-20" width="14" height="11" fill="#fff" opacity="0.12" rx="2"/>
  </g>
  <!-- Label -->
  <rect x="190" y="535" width="420" height="70" fill="#000" fill-opacity="0.35" rx="35"/>
  <text x="400" y="578" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#fff">Drinks &amp; Shakes</text>
  <text x="400" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#F8BBD0" letter-spacing="4" opacity="0.8">COOL &amp; REFRESHING</text>
</svg>
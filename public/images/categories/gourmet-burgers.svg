      <stop offset="0%" stop-color="#4A148C"/>
      <stop offset="100%" stop-color="#1A0033"/>
    </radialGradient>
    <filter id="cshadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="cgold" x1="0" y1="0" x2="1" y2="1">

    <path d="M-80,-30 Q-50,-38 -20,-28 Q10,-38 40,-30 Q70,-38 80,-30" fill="none" stroke="#F5F5DC" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M-140,-18 Q-105,-30 -70,-14 Q-35,-30 0,-16 Q35,-30 70,-14 Q105,-30 140,-18 L140,-8 Q105,-20 70,-4 Q35,-20 0,-6 Q-35,-20 -70,-4 Q-105,-20 -140,-8 Z" fill="#2E7D32"/>

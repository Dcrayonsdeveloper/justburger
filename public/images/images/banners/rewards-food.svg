<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="rfbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2b1f"/>
      <stop offset="100%" stop-color="#5a3a28"/>
    </linearGradient>
    <linearGradient id="rfbun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4903A"/>
      <stop offset="100%" stop-color="#A0622A"/>
    </linearGradient>
    <linearGradient id="rfpatty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B3F14"/>
      <stop offset="100%" stop-color="#4A2508"/>
    </linearGradient>
    <linearGradient id="rfcup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="rfshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="rfsoft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="rfclip1"><rect x="20" y="20" width="170" height="170" rx="16"/></clipPath>
    <clipPath id="rfclip2"><rect x="210" y="20" width="170" height="170" rx="16"/></clipPath>
    <clipPath id="rfclip3"><rect x="400" y="20" width="180" height="360" rx="16"/></clipPath>
    <clipPath id="rfclip4"><rect x="20" y="210" width="360" height="170" rx="16"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#rfbg)"/>

  <!-- Grid layout: 4 tiles -->

  <!-- Tile 1: Top-left - Burger -->
  <rect x="20" y="20" width="170" height="170" rx="16" fill="#4a3020"/>
  <g clip-path="url(#rfclip1)">
    <rect x="20" y="20" width="170" height="170" fill="#4a3020"/>
    <!-- Warm glow -->
    <circle cx="105" cy="105" r="80" fill="#FF8F00" opacity="0.08"/>
    <!-- Burger -->
    <g transform="translate(105, 105)" filter="url(#rfsoft)">
      <ellipse cx="0" cy="-28" rx="52" ry="24" fill="url(#rfbun)"/>
      <ellipse cx="0" cy="-34" rx="40" ry="14" fill="#E8A94D" opacity="0.3"/>
      <ellipse cx="-15" cy="-38" rx="4" ry="2.2" fill="#FFF5DC" opacity="0.7"/>
      <ellipse cx="10" cy="-40" rx="4" ry="2.2" fill="#FFF5DC" opacity="0.7"/>
      <ellipse cx="25" cy="-35" rx="3.5" ry="2" fill="#FFF5DC" opacity="0.6"/>
      <path d="M-55,-8 Q-38,-18 -22,-6 Q-5,-18 12,-7 Q28,-18 44,-6 Q55,-14 55,-8 L55,0 Q44,-10 30,2 Q15,-10 0,2 Q-15,-10 -30,2 Q-44,-8 -55,0 Z" fill="#4CAF50"/>
      <ellipse cx="-18" cy="2" rx="16" ry="4" fill="#E53935"/>
      <ellipse cx="16" cy="3" rx="14" ry="3.5" fill="#EF5350"/>
      <rect x="-52" y="6" width="104" height="10" fill="#FFC107" rx="2"/>
      <ellipse cx="0" cy="24" rx="50" ry="14" fill="url(#rfpatty)"/>
      <rect x="-52" y="34" width="104" height="15" fill="#C07A2E" rx="4"/>
      <ellipse cx="0" cy="49" rx="52" ry="7" fill="#8B5A1E"/>
    </g>
  </g>
  <rect x="20" y="20" width="170" height="170" rx="16" fill="none" stroke="#6b4a35" stroke-width="1"/>

  <!-- Tile 2: Top-right - Fries -->
  <rect x="210" y="20" width="170" height="170" rx="16" fill="#4a3020"/>
  <g clip-path="url(#rfclip2)">
    <rect x="210" y="20" width="170" height="170" fill="#4a3020"/>
    <circle cx="295" cy="105" r="80" fill="#FFC107" opacity="0.06"/>
    <!-- Fries -->
    <g transform="translate(295, 110)" filter="url(#rfsoft)">
      <path d="M-30,22 L-25,-28 L25,-28 L30,22 Z" fill="url(#rfcup)"/>
      <path d="M-30,22 L30,22 L28,28 L-28,28 Z" fill="#B71C1C"/>
      <rect x="-22" y="-14" width="44" height="6" fill="#fff" opacity="0.15" rx="1"/>
      <rect x="-20" y="-70" width="6" height="48" fill="#F9C74F" rx="2" transform="rotate(-6,-17,-46)"/>
      <rect x="-10" y="-78" width="6" height="54" fill="#F4B942" rx="2" transform="rotate(2,-7,-51)"/>
      <rect x="0" y="-72" width="6" height="48" fill="#F9C74F" rx="2"/>
      <rect x="10" y="-75" width="6" height="50" fill="#EDAA30" rx="2" transform="rotate(5,13,-50)"/>
      <rect x="-28" y="-60" width="5" height="38" fill="#EDAA30" rx="2" transform="rotate(-10,-26,-41)"/>
      <rect x="20" y="-58" width="5" height="36" fill="#F4B942" rx="2" transform="rotate(10,22,-40)"/>
    </g>
  </g>
  <rect x="210" y="20" width="170" height="170" rx="16" fill="none" stroke="#6b4a35" stroke-width="1"/>

  <!-- Tile 3: Right tall - Drink -->
  <rect x="400" y="20" width="180" height="360" rx="16" fill="#4a3020"/>
  <g clip-path="url(#rfclip3)">
    <rect x="400" y="20" width="180" height="360" fill="#4a3020"/>
    <circle cx="490" cy="200" r="100" fill="#E53935" opacity="0.05"/>
    <!-- Large drink cup -->
    <g transform="translate(490, 200)" filter="url(#rfshadow)">
      <path d="M-38,60 L-30,-70 L30,-70 L38,60 Z" fill="url(#rfcup)"/>
      <path d="M-38,60 L38,60 L35,68 L-35,68 Z" fill="#8E0000"/>
      <!-- Cup design -->
      <rect x="-28" y="-30" width="56" height="14" fill="#FFC107" opacity="0.25" rx="2"/>
      <rect x="-24" y="10" width="48" height="10" fill="#fff" opacity="0.08" rx="1"/>
      <!-- Cup highlight -->
      <rect x="-24" y="-65" width="6" height="120" fill="#fff" opacity="0.06" rx="3"/>
      <!-- Lid -->
      <ellipse cx="0" cy="-70" rx="35" ry="9" fill="#fff" opacity="0.9"/>
      <ellipse cx="0" cy="-72" rx="31" ry="6.5" fill="#e0e0e0"/>
      <!-- Dome top for milkshake -->
      <path d="M-28,-72 Q-28,-100 0,-105 Q28,-100 28,-72" fill="#fff" opacity="0.85"/>
      <path d="M-24,-74 Q-24,-95 0,-99 Q24,-95 24,-74" fill="#F8BBD0" opacity="0.5"/>
      <!-- Whipped cream swirl -->
      <circle cx="0" cy="-98" r="8" fill="#fff" opacity="0.9"/>
      <circle cx="-8" cy="-90" r="6" fill="#fff" opacity="0.85"/>
      <circle cx="8" cy="-90" r="6" fill="#fff" opacity="0.85"/>
      <!-- Cherry on top -->
      <circle cx="0" cy="-108" r="6" fill="#E53935"/>
      <circle cx="-1" cy="-110" r="2" fill="#EF5350" opacity="0.5"/>
      <path d="M0,-114 Q5,-120 3,-125" fill="none" stroke="#4CAF50" stroke-width="1.5"/>
    </g>
  </g>
  <rect x="400" y="20" width="180" height="360" rx="16" fill="none" stroke="#6b4a35" stroke-width="1"/>

  <!-- Tile 4: Bottom-left wide - Chicken wings & sides -->
  <rect x="20" y="210" width="360" height="170" rx="16" fill="#4a3020"/>
  <g clip-path="url(#rfclip4)">
    <rect x="20" y="210" width="360" height="170" fill="#4a3020"/>
    <circle cx="200" cy="295" r="90" fill="#FF8F00" opacity="0.06"/>
    <!-- Plate/tray -->
    <ellipse cx="200" cy="310" rx="140" ry="40" fill="#5a3a28"/>
    <ellipse cx="200" cy="306" rx="135" ry="36" fill="#6b4a35"/>
    <!-- Chicken wings -->
    <g filter="url(#rfsoft)">
      <ellipse cx="130" cy="290" rx="28" ry="16" fill="#D4903A" transform="rotate(-20,130,290)"/>
      <ellipse cx="130" cy="287" rx="24" ry="12" fill="#E8A94D" opacity="0.4" transform="rotate(-20,130,287)"/>
      <ellipse cx="170" cy="282" rx="26" ry="15" fill="#C07A2E" transform="rotate(10,170,282)"/>
      <ellipse cx="170" cy="279" rx="22" ry="11" fill="#D4903A" opacity="0.4" transform="rotate(10,170,279)"/>
      <ellipse cx="200" cy="288" rx="24" ry="14" fill="#D4903A" transform="rotate(-5,200,288)"/>
      <ellipse cx="240" cy="284" rx="27" ry="15" fill="#C07A2E" transform="rotate(15,240,284)"/>
      <ellipse cx="240" cy="281" rx="23" ry="11" fill="#D4903A" opacity="0.4" transform="rotate(15,240,281)"/>
      <ellipse cx="272" cy="290" rx="24" ry="14" fill="#D4903A" transform="rotate(-12,272,290)"/>
    </g>
    <!-- Dipping sauce cup -->
    <g transform="translate(310, 285)">
      <ellipse cx="0" cy="8" rx="18" ry="12" fill="#5D2F0E"/>
      <ellipse cx="0" cy="0" rx="18" ry="10" fill="#6b4a35"/>
      <ellipse cx="0" cy="0" rx="14" ry="7" fill="#E53935"/>
      <ellipse cx="-3" cy="-2" rx="5" ry="3" fill="#EF5350" opacity="0.4"/>
    </g>
    <!-- Garnish - green leaves -->
    <g transform="translate(100, 295)" opacity="0.7">
      <path d="M0,0 Q-8,-12 -4,-20 Q0,-14 4,-20 Q8,-12 0,0 Z" fill="#4CAF50"/>
    </g>
    <g transform="translate(290, 298)" opacity="0.6">
      <path d="M0,0 Q-6,-10 -3,-16 Q0,-11 3,-16 Q6,-10 0,0 Z" fill="#388E3C"/>
    </g>
  </g>
  <rect x="20" y="210" width="360" height="170" rx="16" fill="none" stroke="#6b4a35" stroke-width="1"/>

  <!-- Subtle overall warm vignette -->
  <rect width="600" height="400" rx="0" fill="none" stroke="#2d1810" stroke-width="8" opacity="0.3"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <linearGradient id="s3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="50%" stop-color="#2a1210"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="s3bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4903A"/>
      <stop offset="100%" stop-color="#A0622A"/>
    </linearGradient>
    <linearGradient id="s3patty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B3410"/>
      <stop offset="100%" stop-color="#3E1E06"/>
    </linearGradient>
    <radialGradient id="s3glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#C8102E" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C8102E" stop-opacity="0"/>
    </radialGradient>
    <filter id="s3sh"><feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1920" height="600" fill="url(#s3bg)"/>
  <rect width="1920" height="600" fill="url(#s3glow)"/>
  <!-- Warm bokeh -->
  <circle cx="400" cy="80" r="60" fill="#C8102E" opacity="0.06"/>
  <circle cx="1500" cy="120" r="80" fill="#FF8F00" opacity="0.05"/>
  <circle cx="200" cy="500" r="70" fill="#FFC107" opacity="0.04"/>
  <circle cx="1700" cy="450" r="55" fill="#C8102E" opacity="0.04"/>
  <!-- Multiple burgers spread across (family feast) -->
  <!-- Burger 1 - left -->
  <g transform="translate(550, 300) scale(0.7)" filter="url(#s3sh)">

    <ellipse cx="-8" cy="-102" rx="112" ry="30" fill="#E8A94D" opacity="0.2"/>
    <ellipse cx="-50" cy="-108" rx="7" ry="3.5" fill="#FFF5DC" opacity="0.7"/>
    <ellipse cx="20" cy="-112" rx="7" ry="3.5" fill="#FFF5DC" opacity="0.7"/>
    <ellipse cx="70" cy="-100" rx="7" ry="3.5" fill="#FFF5DC" opacity="0.65"/>
    <path d="M-165,-24 Q-115,-46 -65,-20 Q-15,-44 35,-22 Q85,-44 135,-22 Q160,-38 170,-22 L170,-8 Q135,-28 90,-4 Q40,-28 -10,-6 Q-60,-28 -110,-6 Q-155,-22 -165,-8 Z" fill="#4CAF50"/>
    <ellipse cx="-60" cy="-3" rx="38" ry="9" fill="#E53935"/>
    <ellipse cx="55" cy="-1" rx="34" ry="8" fill="#EF5350"/>
    <path d="M-155,8 L155,8 L155,18 Q130,18 125,30 Q121,38 118,18 L40,18 Q35,18 30,28 Q26,36 23,18 L-90,18 Q-94,18 -98,30 Q-102,38 -105,18 L-155,18 Z" fill="#FFC107"/>
    <ellipse cx="0" cy="28" rx="150" ry="30" fill="url(#s3patty)"/>
    <ellipse cx="0" cy="50" rx="145" ry="26" fill="#5D2F0E"/>
    <rect x="-160" y="68" width="320" height="30" fill="#8B5A1E" rx="4"/>
  </g>
  <!-- Burger 3 - far right smaller -->
  <g transform="translate(1500, 320) scale(0.55)" filter="url(#s3sh)">
    <ellipse cx="0" cy="-75" rx="140" ry="60" fill="url(#s3bun)"/>
    <ellipse cx="-30" cy="-90" rx="6" ry="3" fill="#FFF5DC" opacity="0.6"/>
    <ellipse cx="20" cy="-92" rx="6" ry="3" fill="#FFF5DC" opacity="0.6"/>
    <path d="M-145,-18 Q-100,-36 -50,-14 Q0,-34 50,-16 Q100,-34 140,-16 L142,-5 Q100,-22 52,-2 Q2,-22 -48,-2 Q-98,-18 -145,-5 Z" fill="#4CAF50"/>
    <path d="M-130,5 L130,5 L130,14 Q110,14 105,22 Q102,28 100,14 L-90,14 Q-94,14 -98,24 Q-102,30 -104,14 L-130,14 Z" fill="#FFC107"/>
    <ellipse cx="0" cy="20" rx="130" ry="25" fill="url(#s3patty)"/>
    <rect x="-140" y="40" width="280" height="25" fill="#8B5A1E" rx="3"/>
  </g>
  <!-- Fries container -->
  <g transform="translate(780, 420) rotate(-8)" opacity="0.35">
    <rect x="-30" y="-60" width="60" height="80" rx="4" fill="#C8102E"/>
    <rect x="-25" y="-55" width="50" height="12" fill="#FFC107" opacity="0.3" rx="2"/>
    <rect x="-8" y="-90" width="10" height="50" rx="3" fill="#FFD54F"/>
    <rect x="5" y="-95" width="10" height="55" rx="3" fill="#FFC107"/>
    <rect x="-20" y="-85" width="10" height="45" rx="3" fill="#E8A94D"/>
    <rect x="18" y="-88" width="10" height="48" rx="3" fill="#FFD54F"/>
  </g>
  <!-- Drink cup -->
  <g transform="translate(1350, 400)" opacity="0.3">
    <path d="M-20,-50 L-15,30 L15,30 L20,-50 Z" fill="#fff"/>
    <rect x="-22" y="-55" width="44" height="8" rx="2" fill="#ddd"/>
    <rect x="-18" y="-40" width="36" height="12" rx="2" fill="#C8102E" opacity="0.6"/>
    <line x1="0" y1="-55" x2="5" y2="-80" stroke="#8B5A1E" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
    <ellipse cx="-8" cy="-98" rx="105" ry="28" fill="#E8A94D" opacity="0.2"/>
    <ellipse cx="-40" cy="-100" rx="7" ry="3.5" fill="#FFF5DC" opacity="0.7"/>
    <ellipse cx="30" cy="-105" rx="7" ry="3.5" fill="#FFF5DC" opacity="0.7"/>
    <path d="M-155,-22 Q-110,-42 -60,-18 Q-10,-40 40,-20 Q90,-40 140,-20 L145,-8 Q95,-26 45,-4 Q-5,-26 -55,-6 Q-105,-22 -155,-8 Z" fill="#4CAF50"/>
    <ellipse cx="-50" cy="-2" rx="35" ry="8" fill="#E53935"/>
    <path d="M-145,8 L145,8 L145,16 Q120,16 115,28 Q112,34 110,16 L-100,16 Q-105,16 -110,26 Q-114,34 -116,16 L-145,16 Z" fill="#FFC107"/>
    <ellipse cx="0" cy="24" rx="140" ry="28" fill="url(#s3patty)"/>
    <rect x="-150" y="46" width="300" height="28" fill="#8B5A1E" rx="4"/>
  </g>
  <!-- Burger 2 - center right -->
  <g transform="translate(1050, 280) scale(0.8)" filter="url(#s3sh)">

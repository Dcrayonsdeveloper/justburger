<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="gcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d1810"/>
    </linearGradient>
    <linearGradient id="gccard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="30%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="gcshine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="gcred" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="gcribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="gcshadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="gcglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gcemboss" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="gcspot" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#E53935" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E53935" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#gcbg)"/>

  <!-- Background bokeh/glow -->
  <circle cx="120" cy="100" r="120" fill="#E53935" opacity="0.04"/>
  <circle cx="400" cy="320" r="100" fill="#FFC107" opacity="0.03"/>
  <circle cx="250" cy="200" r="180" fill="#FF8F00" opacity="0.02"/>

  <!-- Gift card with perspective shadow -->
  <g filter="url(#gcshadow)">
    <!-- Card base -->
    <rect x="60" y="80" width="380" height="240" rx="16" fill="url(#gccard)"/>
    <!-- Card shine overlay -->
    <rect x="60" y="80" width="380" height="240" rx="16" fill="url(#gcshine)"/>
    <!-- Red glow accent -->
    <rect x="60" y="80" width="380" height="240" rx="16" fill="url(#gcspot)"/>
    <!-- Card border -->
    <rect x="60" y="80" width="380" height="240" rx="16" fill="none" stroke="#E53935" stroke-width="1" opacity="0.3"/>
    <!-- Inner subtle border -->
    <rect x="70" y="90" width="360" height="220" rx="12" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.05"/>
  </g>

  <!-- Diagonal decorative stripe (red accent) -->
  <g opacity="0.12">
    <path d="M60,180 L180,80 L220,80 L60,220 Z" fill="#E53935"/>
    <path d="M60,230 L240,80 L260,80 L60,260 Z" fill="#E53935"/>
  </g>

  <!-- Red accent bar at top of card -->
  <rect x="60" y="80" width="380" height="6" rx="3" fill="url(#gcred)" opacity="0.8"/>

  <!-- Logo area - burger icon instead of text -->
  <g filter="url(#gcemboss)">
    <!-- Logo mark - burger icon -->
    <g transform="translate(100, 125)">
      <circle cx="0" cy="0" r="22" fill="#E53935" opacity="0.15"/>
      <!-- Mini burger -->
      <ellipse cx="0" cy="-6" rx="14" ry="7" fill="#D4903A"/>
      <ellipse cx="0" cy="-8" rx="10" ry="4" fill="#E8A94D" opacity="0.3"/>
      <rect x="-14" y="-1" width="28" height="3" fill="#FFC107" rx="1"/>
      <ellipse cx="0" cy="5" rx="13" ry="5" fill="#5D2F0E"/>
      <rect x="-14" y="8" width="28" height="5" fill="#A0622A" rx="2"/>
    </g>
    <!-- Placeholder bars instead of text -->
    <rect x="130" y="112" width="120" height="10" rx="4" fill="#fff" opacity="0.7"/>
    <rect x="130" y="130" width="65" height="6" rx="3" fill="#E53935" opacity="0.6"/>
  </g>

  <!-- Gift card amount area (decorative circle instead of text) -->
  <g transform="translate(250, 200)">
    <circle cx="0" cy="-5" r="35" fill="#FFC107" opacity="0.12" filter="url(#gcglow)"/>
    <circle cx="0" cy="-5" r="25" fill="#FFC107" opacity="0.15"/>
    <circle cx="0" cy="-5" r="16" fill="#FFC107" opacity="0.2"/>
    <line x1="-60" y1="18" x2="60" y2="18" stroke="#FFC107" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Card number area (dots/blocks instead of actual numbers) -->
  <g transform="translate(88, 265)">
    <!-- Four groups of dots -->
    <g>
      <circle cx="0" cy="0" r="3" fill="#888" opacity="0.5"/>
      <circle cx="10" cy="0" r="3" fill="#888" opacity="0.5"/>
      <circle cx="20" cy="0" r="3" fill="#888" opacity="0.5"/>
      <circle cx="30" cy="0" r="3" fill="#888" opacity="0.5"/>
    </g>
    <g>
      <circle cx="55" cy="0" r="3" fill="#888" opacity="0.5"/>
      <circle cx="65" cy="0" r="3" fill="#888" opacity="0.5"/>
      <circle cx="75" cy="0" r="3" fill="#888" opacity="0.5"/>
      <circle cx="85" cy="0" r="3" fill="#888" opacity="0.5"/>
    </g>
    <g>
      <circle cx="110" cy="0" r="3" fill="#888" opacity="0.5"/>
      <circle cx="120" cy="0" r="3" fill="#888" opacity="0.5"/>
      <circle cx="130" cy="0" r="3" fill="#888" opacity="0.5"/>
      <circle cx="140" cy="0" r="3" fill="#888" opacity="0.5"/>
    </g>
    <g>
      <circle cx="165" cy="0" r="3" fill="#888" opacity="0.5"/>
      <circle cx="175" cy="0" r="3" fill="#888" opacity="0.5"/>
      <circle cx="185" cy="0" r="3" fill="#888" opacity="0.5"/>
      <circle cx="195" cy="0" r="3" fill="#888" opacity="0.5"/>
    </g>
  </g>

  <!-- Valid thru area (placeholder bars) -->
  <g transform="translate(88, 292)">
    <rect x="0" y="-4" width="45" height="5" rx="2" fill="#666" opacity="0.5"/>
    <rect x="55" y="-4" width="30" height="5" rx="2" fill="#999" opacity="0.5"/>
  </g>

  <!-- Chip icon -->
  <g transform="translate(350, 270)">
    <rect x="0" y="0" width="36" height="28" rx="4" fill="#C0A060" opacity="0.6"/>
    <rect x="2" y="2" width="32" height="24" rx="3" fill="none" stroke="#A08040" stroke-width="0.5" opacity="0.5"/>
    <line x1="12" y1="2" x2="12" y2="26" stroke="#A08040" stroke-width="0.5" opacity="0.4"/>
    <line x1="24" y1="2" x2="24" y2="26" stroke="#A08040" stroke-width="0.5" opacity="0.4"/>
    <line x1="2" y1="10" x2="34" y2="10" stroke="#A08040" stroke-width="0.5" opacity="0.4"/>
    <line x1="2" y1="18" x2="34" y2="18" stroke="#A08040" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Ribbon bow at top-right -->
  <g transform="translate(390, 75)">
    <path d="M0,0 Q-25,-20 -15,-35 Q-8,-42 0,-30 Q8,-42 15,-35 Q25,-20 0,0 Z" fill="url(#gcribbon)" opacity="0.9"/>
    <circle cx="0" cy="-2" r="6" fill="#E53935"/>
    <circle cx="0" cy="-3" r="4" fill="#EF5350" opacity="0.5"/>
    <path d="M-4,3 L-18,30 L-10,25 L-6,35" fill="none" stroke="#E53935" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M4,3 L18,30 L10,25 L6,35" fill="none" stroke="#C62828" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Sparkle elements -->
  <g opacity="0.4">
    <path d="M80,60 L82,54 L84,60 L90,62 L84,64 L82,70 L80,64 L74,62 Z" fill="#FFC107"/>
  </g>
  <g opacity="0.3">
    <path d="M430,350 L431.5,345 L433,350 L438,351.5 L433,353 L431.5,358 L430,353 L425,351.5 Z" fill="#FFC107"/>
  </g>
  <g opacity="0.25">
    <path d="M150,350 L151,346 L152,350 L156,351 L152,352 L151,356 L150,352 L146,351 Z" fill="#E53935"/>
  </g>
  <g opacity="0.2">
    <path d="M350,60 L351.5,55 L353,60 L358,61.5 L353,63 L351.5,68 L350,63 L345,61.5 Z" fill="#fff"/>
  </g>

  <!-- Small decorative dots -->
  <circle cx="100" cy="350" r="2" fill="#E53935" opacity="0.3"/>
  <circle cx="420" cy="55" r="2.5" fill="#FFC107" opacity="0.25"/>
  <circle cx="70" cy="55" r="1.5" fill="#FFC107" opacity="0.2"/>
  <circle cx="460" cy="360" r="2" fill="#E53935" opacity="0.2"/>

  <!-- Bottom tagline (placeholder bar instead of text) -->
  <rect x="140" y="365" width="220" height="7" rx="3" fill="#666" opacity="0.4"/>
</svg>